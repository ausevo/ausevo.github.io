name: Sync schedule from Google Sheets

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub delivers within ~5-10 min)
  workflow_dispatch:           # manual trigger: Actions tab → Run workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push the commit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch sheet and regenerate YAML
        run: |
          PYTHONIOENCODING=utf-8 python scripts/programme_from_xlsx.py
        # No path argument → reads source_url from scripts/programme_overrides.yml

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet _data/programme_2026.yml || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate PDF programme
        if: steps.diff.outputs.changed == 'true'
        run: |
          CHROME=$(which chromium-browser) python scripts/programme_to_pdf.py
        env:
          CHROME: /usr/bin/chromium-browser

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/programme_2026.yml docs/2026/Evolution_in_the_Gong_2026_Programme.pdf
          git commit -m "chore: auto-update schedule and PDF from Google Sheets [skip ci]"
          git push
        # [skip ci] prevents a second Actions run; GitHub Pages still rebuilds on push
