name: Regenerate PDF programme

on:
  push:
    paths:
      - "_data/sasb_council.yml"
      - "_data/exec.yml"
      - "_data/sponsors.yml"
      - "scripts/programme_to_pdf.py"
      - "scripts/programme_overrides.yml"
  workflow_dispatch:   # manual trigger: Actions tab → Run workflow

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate PDF
        run: python scripts/programme_to_pdf.py
        env:
          CHROME: /usr/bin/chromium-browser

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/2026/Evolution_in_the_Gong_2026_Programme.pdf
          git diff --staged --quiet || git commit -m "chore: regen PDF [skip ci]" && git push
